[package]
name = "skia-winit-renderer"
version = "0.1.0"
edition = "2021"

[features]
default = ["egl", "glx", "x11", "wayland", "wgl"]
egl = ["glutin-winit/egl"]
glx = ["glutin-winit/glx"]
wgl = ["glutin-winit/wgl"]
x11 = ["glutin-winit/x11"]
wayland = [
    "glutin-winit/wayland",
    "winit/wayland-dlopen",
    "winit/wayland-csd-adwaita-notitle",
]

[dependencies]
raw-window-handle = "0.5"
winit = { version = "0.29", default-features = false, features = [
    "rwh_05",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
] }
softbuffer = "0.3"
glutin = "0.31"
glutin-winit = "0.4"
skia-safe = { version = "0.73", features = ["textlayout", "gl"] }
gl = "0.14.0"
provide-any = { git = "https://github.com/thisKai/provide-any.git", version = "0.1.0" }
skia-d3d12-swap-chain = { git = "https://github.com/thisKai/rust-skia-d3d12-swap-chain", version = "0.1.0" }

[target.'cfg(unix)'.dependencies]
skia-safe = { version = "0.73", features = [
    "textlayout",
    "gl",
    "x11",
    "wayland",
] }

[target.'cfg(windows)'.dependencies]
skia-safe = { version = "0.73", features = ["textlayout", "gl", "d3d"] }
windows = { version = "0.56", features = [
    "System",
    "Foundation_Numerics",
    "Win32",
    "Win32_Foundation",
    "Win32_Graphics",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_System_WinRT_Composition",
    "UI_Composition",
    "UI_Composition_Desktop",
] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-glue = "0.7" # Keep in sync with winit dependency

[build-dependencies]
gl_generator = "0.14"
cfg_aliases = "0.2"
